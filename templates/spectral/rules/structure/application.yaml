extends: []

rules:
application-structure:
description: "Valida application.json contra el JSON Schema"
message: "{{error}}"
severity: error
given: "$"
then:
function: schema
functionOptions:
allErrors: true
schema:
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "application.schema.json"
title: "CDC Replication Application Configuration"
description: "Schema para validar la configuración de una petición de replicación CDC"
type: object

      additionalProperties: false

      required:
        - env
        - request_type
        - project
        - bbdd_engine
        - bbdd_name
        - tables
        - replication_type
        - target_engine
        - kafka_cluster_name
        - kafka_identity_pool
        - kafka_topic_prefix
        - user_name
        - cost_center
        - change_number

      properties:
        env:
          type: string
          minLength: 1
          description: "Entorno de ejecucion"
          pattern: '^(DEV|PRE|PRO|\$\{ENV\})$'

        request_type:
          type: string
          minLength: 1
          description: "Tipo de peticion de replicacion"
          pattern: '^(CREATE|UPDATE|DELETE|\$\{REQUEST_TYPE\})$'

        project:
          type: string
          minLength: 1
          description: "Proyecto asociado a la replicacion"
          pattern: '^(.+)$'

        bbdd_engine:
          type: string
          minLength: 1
          description: "Motor de base de datos"
          pattern: '^(ORACLE|\$\{BBDD_ENGINE\})$'

        bbdd_name:
          type: string
          minLength: 1
          description: "Nombre de la base de datos"
          pattern: '^([A-Z][A-Z0-9_$#]*|\$\{BBDD_NAME\})$'

        tables:
          type: array
          minItems: 1
          description: "Lista de tablas a replicar"
          items:
            type: string
            minLength: 1
            pattern: '^(.+)$'

        replication_type:
          type: string
          minLength: 1
          description: "Tipo de replicacion"
          pattern: '^(ONLINE|\$\{REPLICATION_TYPE\})$'

        target_engine:
          type: string
          minLength: 1
          description: "Motor destino"
          pattern: '^(KAFKA|AWS-S3|\$\{TARGET_ENGINE\})$'

        kafka_cluster_name:
          type: string
          minLength: 1
          description: "Nombre del cluster Kafka"
          pattern: '^(.+|\$\{KAFKA_CLUSTER_NAME\})$'

        kafka_identity_pool:
          type: string
          minLength: 1
          description: "Identity Pool de Kafka"
          pattern: '^(.+|\$\{KAFKA_IDENTITY_POOL\})$'

        kafka_topic_prefix:
          type: string
          minLength: 1
          description: "Prefijo utilizado para los topics Kafka"
          pattern: '^([a-z0-9]+([._-][a-z0-9]+)*|\$\{KAFKA_TOPIC_PREFIX\})$'

        target_info:
          type: string
          description: "Informacion del destino"
          pattern: '^.*$'

        user_name:
          type: string
          minLength: 1
          description: "Usuario solicitante"
          pattern: '^(.+)$'

        cost_center:
          type: string
          minLength: 1
          description: "Centro de coste"
          pattern: '^(.+)$'

        change_number:
          type: string
          minLength: 1
          description: "Numero de cambio asociado a la peticion"
          pattern: '^(C00[A-Z0-9]+|\$\{CHANGE_NUMBER\})$'

        comments:
          type: string
          description: "Comentarios adicionales de la replicacion"
          pattern: '^.*$'
