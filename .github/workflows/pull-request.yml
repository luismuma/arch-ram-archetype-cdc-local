# Pull Request Workflow. Triggers when:
#   - A pull request from feature to develop is created / synchronized
#   - A pull request from hotfix to main is created / synchronized

name: PR workflow
run-name: "Validate Archetype PR #${{ github.run_number }}"

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop
      - main
      - master
  workflow_dispatch:
jobs:
  validate-scaffolding:
    name: Validate Archetype Structure
    uses: luismuma/arch-ram-reusable-workflows-local/.github/workflows/validate-scaffolding.yml@main
