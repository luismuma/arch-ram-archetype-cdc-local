name: Publish Archetype
run-name: "Publish Archetype #${{ github.run_number }} - ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
jobs:
  publish:
    uses: mapfre-tech/arch-ram-reusable-workflows/.github/workflows/archetype.publish.yml@v1
    with:
      archetype-version-file: pom.xml.ftl
    secrets:
      app-semantic-release-id: ${{ secrets.APP_SEMANTIC_RELEASE_ID }}
      app-semantic-release-private-key: ${{ secrets.APP_SEMANTIC_RELEASE_PRIVATE_KEY }}
