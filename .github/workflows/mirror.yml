name: Mirror to mapfre-test-pre

on:
  push:
    branches: ["**"]
    tags: ["*"]
  delete:
  workflow_dispatch:

jobs:
  mirror:
    uses: mapfre-tech/arch-ram-reusable-workflows/.github/workflows/mirror.yml@main
    with:
      org: mapfre-test-pre
    secrets:
      GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
